# PR Review (flipt-io/agents fleet agent)
# Reviews pull requests against repo conventions (layered from
# .agents/pr-review/) and posts the review. The swarm's SAM executor opens
# PRs from worker branches; this is the automated verify pass on them.
#
# Pinned to the fork branch fix/pnpm-install-isolated (PR flipt-io/agents#17,
# still open upstream) because the upstream @main action hardcodes
# pnpm/action-setup with version 11, which hard-fails against any consumer
# repo that pins packageManager ("Multiple versions of pnpm specified").
# The fork replaces that step with `npm install -g pnpm@11`, which never
# resolves a version from this repo. Once upstream merges, switch back to
# flipt-io/agents/actions/pr-review@main.
name: PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write # posts the review
  models: read # default model (github/openai/gpt-4.1) auth — no API key

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: sjoerd2025/agents/actions/pr-review@fix/pnpm-install-isolated
        with:
          pr-number: ${{ github.event.pull_request.number }}
          local-config-dir: .agents/pr-review
